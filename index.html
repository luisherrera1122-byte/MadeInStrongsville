<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Made In Strongsville</title>
<meta name="description" content="Something is coming to Strongsville.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#080b14; --navy-2:#111624; --navy-3:#1a2136;
    --gold:#c9a24b; --gold-bright:#e9cc85; --ink:#eef1f6; --muted:#8b93a7;
    --line:rgba(238,241,246,0.09);
  }
  *{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; } }
  body{
    margin:0; min-height:100vh; background:var(--navy); color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:32px; position:relative; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  body::before{
    content:""; position:fixed; inset:-20%;
    background:
      radial-gradient(ellipse 600px 500px at 50% 40%, rgba(201,162,75,0.16), transparent 65%),
      radial-gradient(ellipse 700px 400px at 15% 90%, rgba(179,39,59,0.08), transparent 65%),
      radial-gradient(ellipse 700px 400px at 90% 10%, rgba(91,155,213,0.07), transparent 65%);
    animation:drift 16s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes drift{ from{ transform:scale(1) translateY(0); } to{ transform:scale(1.1) translateY(-16px); } }

  .stage{ position:relative; z-index:1; max-width:640px; }
  .shield{ font-size:34px; color:var(--gold); margin-bottom:18px; text-shadow:0 0 30px rgba(201,162,75,0.4); }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--gold); margin-bottom:20px;
  }
  h1{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-weight:600;
    font-size:clamp(32px,7vw,56px); margin:0 0 16px; line-height:1.05;
  }
  h1 span{ color:var(--gold); }
  .sub{ color:var(--muted); font-size:16px; max-width:44ch; margin:0 auto 44px; }

  .countdown{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:40px; }
  .box{
    background:linear-gradient(180deg,#05060a,#0d101c);
    border:1px solid var(--line); border-top:3px solid var(--gold);
    border-radius:10px; padding:20px 24px; text-align:center; min-width:84px;
    box-shadow:inset 0 2px 14px rgba(0,0,0,0.6), 0 14px 34px -16px rgba(201,162,75,0.35);
  }
  .box .n{
    font-family:'JetBrains Mono',monospace; font-size:34px; color:var(--gold-bright); font-weight:500;
    text-shadow:0 0 18px rgba(240,211,140,0.5);
  }
  .box .l{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-top:6px; }

  .date-line{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); letter-spacing:0.06em; margin-bottom:56px; }
  .date-line strong{ color:var(--gold); }

  .whisper{
    min-height:24px; font-size:14px; color:var(--muted); font-style:italic;
    opacity:0; transition:opacity 1.2s ease;
  }
  .whisper.in{ opacity:1; }

  .commish{ margin:44px auto 0; max-width:520px; }
  .commish .label{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.24em; text-transform:uppercase;
    color:var(--gold); margin-bottom:14px;
  }
  .commish .frame{
    aspect-ratio:16/9; border-radius:10px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
  }
  .commish .frame iframe{ width:100%; height:100%; border:0; display:block; }

  footer.locked{
    position:fixed; bottom:22px; left:0; right:0; text-align:center;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:#4a5066;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="shield"><i class="fa-solid fa-shield-halved"></i></div>
  <div class="eyebrow">Est. 2011</div>
  <h1>Made In <span>Strongsville</span></h1>
  <p class="sub">Something's been building behind the scenes. The league is about to see all of it.</p>

  <div class="countdown" id="countdown"></div>
  <div class="date-line">Access opens <strong>August 14, 2026</strong></div>

  <div class="whisper" id="whisper"></div>

  <div class="commish">
    <div class="label"><i class="fa-solid fa-video"></i> A Note From The Commissioner</div>
    <div class="frame">
      <iframe src="https://youtu.be/frCkLO3lfnM" title="Made In Strongsville Commish Note 2026" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</div>

<footer class="locked"><i class="fa-solid fa-lock" style="margin-right:6px;"></i>Locked until reveal day</footer>

<script>
function buildCountdown(el, target){
  function tick(){
    const now = new Date();
    let diff = target - now;
    if(diff <= 0){
      el.innerHTML = `<div class="box"><div class="n">IT'S</div><div class="l">Time</div></div>`;
      clearInterval(timer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff / 3600000) % 24);
    const m = Math.floor((diff / 60000) % 60);
    const s = Math.floor((diff / 1000) % 60);
    el.innerHTML = `
      <div class="box"><div class="n">${d}</div><div class="l">Days</div></div>
      <div class="box"><div class="n">${String(h).padStart(2,'0')}</div><div class="l">Hours</div></div>
      <div class="box"><div class="n">${String(m).padStart(2,'0')}</div><div class="l">Minutes</div></div>
      <div class="box"><div class="n">${String(s).padStart(2,'0')}</div><div class="l">Seconds</div></div>
    `;
  }
  tick();
  const timer = setInterval(tick, 1000);
}
buildCountdown(document.getElementById('countdown'), new Date('2026-08-14T00:00:00'));

const whispers = [
  "Respect the Ice.",
  "The Don remembers 2017.",
  "The Trophy Bandit is watching.",
  "A goat has been spotted on the mountain.",
  "The cauldron hasn't stopped moving.",
  "Mr. Reliable is still waiting on ring number two.",
  "Worst to first isn't just a saying to some of us.",
  "Someone's still chasing their day-one magic.",
  "One bright spot, wedged between two dark ones.",
  "Balance has a price. Ask the guy sitting at .500.",
  "Three years in the basement built one hell of a comeback.",
  "Patience finally paid off in 2025.",
  "Someone still owes a chug.",
  "Fifteen years of receipts. All in one place.",
];
const whisperEl = document.getElementById('whisper');
let wi = 0;
function cycleWhisper(){
  whisperEl.classList.remove('in');
  setTimeout(()=>{
    whisperEl.textContent = whispers[wi % whispers.length];
    whisperEl.classList.add('in');
    wi++;
  }, 600);
}
cycleWhisper();
setInterval(cycleWhisper, 4200);
</script>
</body>
</html>
